# 生产的域名清单（App 标识 app）：安卓和 iOS 主 App 共用这一份，拉同一个签名文件 app.json。
# 两条路径里"提 PR"那条的输入（docs/publisher/README.md "两条路径"）。
# 清单内容的唯一数据源是新主库 main-new 的运维编辑表（sql/ave_app_domain_source.sql）：这个文件的改动合并到 main 后，
# 生产 watcher 在 git pull 时写进生产表（ave_app_domain_entry），再签名下发（CI 不连数据库）；运维也可以直接写表。
# 表被直接改过之后，先 dmctl export 同步回这里（带 table-version）、在它上面改再提 PR。staging 用 apps/app_test 和 _test 表。
# 第一次上线时表里还没有 app，watcher 会把这里的内容直接导入。
# 字段含义见《设计文档》7.2（docs/android/安卓端DomainManager设计文档.md）。
#
# 发布规则（PR 检查和 watcher 都拒绝不满足的）：
#   - api 至少 3 个域名、跨 2 家以上 CDN；应急时确需少于这个数，写 degraded_reason 说明原因
#   - api 的顺序就是首选、备选的顺序；冷备域名平时不要放进来，被封后再补
#   - 冻结（enable: false）时同时删掉坏域名，否则当前域名坏了的设备会一直离线

# 是否允许因失败自动换域名；false 即冻结（更新检查、拉源、删域名触发的切换照常）
enable: true

# 业务域名，按优先级排序。cdn 取值：edgeone、cloudfront
# 初始内容取自老接口 ave_server_config_apidomain 的 platform=android（2026-11-10），备注都是 tc oe（腾讯云 EdgeOne）：
# 目前只有一家 CDN，上线前要补 cloudfront 的域名（发布规则：跨 2 家以上 CDN）。
# 老接口里 iOS 主 App（platform=ios）用的是 cngcscs.com、ccjsjz.com；两端共用之后，这里的每个域名安卓和 iOS 都会访问，
# 要确认都能服务两端（iOS 的两个域名如果要保留，也加到这里）
api:
  - host: artedusharing.com
    cdn: edgeone
  - host: foreseen-shrewd.com
    cdn: edgeone
  - host: dashiliebianbao.com
    cdn: edgeone
  - host: liguiwenhua.com
    cdn: edgeone
  - host: jdr002.com
    cdn: edgeone
  - host: zhankongjian.com
    cdn: edgeone
  - host: jiangnanwm.com
    cdn: edgeone
  - host: sdzrby.com
    cdn: edgeone
  - host: nscc-cd.com
    cdn: edgeone
  - host: gcdz02.com
    cdn: edgeone
  - host: cmywkj.com
    cdn: edgeone
  - host: yjj-cs.com
    cdn: edgeone
  - host: qiyuanlipin.com
    cdn: edgeone
  - host: yuankun-rareearth.com
    cdn: edgeone

# 追加的外部源（https://，最多 4 个）。下架追加的源时要继续同步最新文件至少 6 个月；替换时先加新源、再下架旧源
sources: []

# 临时降级的内置源，只能是 github_pages、s3、oss，最多 2 个
skip_builtin: []

# H5 页面域名（一期新增）
h5: []

# 端上参数（一期新增），端上按上下限截断；参数名和取值范围由 App 端定
tune: {}

# 少于 3 个域名或只剩 1 家 CDN 时必须写明原因，否则 PR 检查和 watcher 都拒绝；平时留空
degraded_reason: ""
